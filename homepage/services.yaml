- Infrastructure:
    # Computers
    - bubbles:
        icon: si-nixos
        widget:
          type: customapi
          url: http://dashboard-api:8080/api/v1/status/bubbles
          mappings:
            - field: status
              label: Status
            - field: metrics.uptime_hours
              label: Uptime
              format: number
              suffix: "h"
            - field: metrics.disk_used_percent
              label: Disk
              format: percent
            - field: metrics.smart_status
              label: SMART
            - field: metrics.borg_last_backup_hours
              label: Backup
              format: number
              suffix: "h ago"
    - dale:
        icon: si-nixos
        widget:
          type: customapi
          url: http://dashboard-api:8080/api/v1/status/dale
          mappings:
            - field: status
              label: Status
            - field: metrics.uptime_hours
              label: Uptime
              format: number
              suffix: "h"
            - field: metrics.disk_used_percent
              label: Disk
              format: percent
            - field: metrics.smart_status
              label: SMART
            - field: metrics.borg_last_backup_hours
              label: Backup
              format: number
              suffix: "h ago"
    # Servers
    - cosmo:
        icon: si-nixos
        widget:
          type: customapi
          url: http://dashboard-api:8080/api/v1/status/cosmo
          mappings:
            - field: status
              label: Status
            - field: metrics.uptime_hours
              label: Uptime
              format: number
              suffix: "h"
            - field: metrics.disk_used_percent
              label: Disk
              format: percent
            - field: metrics.smart_status
              label: SMART
            - field: metrics.borg_last_backup_hours
              label: Backup
              format: number
              suffix: "h ago"
    - pintsize:
        icon: si-nixos
        widget:
          type: customapi
          url: http://dashboard-api:8080/api/v1/status/pintsize
          mappings:
            - field: status
              label: Status
            - field: metrics.uptime_hours
              label: Uptime
              format: number
              suffix: "h"
            - field: metrics.disk_used_percent
              label: Disk
              format: percent
            - field: metrics.smart_status
              label: SMART
            - field: metrics.borg_last_backup_hours
              label: Backup
              format: number
              suffix: "h ago"

