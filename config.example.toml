# Dashboard API configuration
# Copy to config.toml and edit for your environment.
# Do NOT commit config.toml (it may contain secrets).

[server]
listen = "0.0.0.0:8080"
poll_interval_minutes = 5          # How often to scrape all targets

[incus]
url = "https://incus-host.tailnet-name.ts.net:8443"
cert_file = "/secrets/metrics.crt"
key_file = "/secrets/metrics.key"

# Optional dead-man's switch. When set, the URL is requested after every poll
# cycle in which at least one target answered; a service such as
# healthchecks.io alerts when the pings stop. The URL is a credential.
# [heartbeat]
# url = "https://hc-ping.com/your-check-uuid"

# Add one [[nixos]] block per monitored NixOS machine.
# `critical` is passed through in the status JSON: true for always-on
# machines, false for laptops and desktops that are expected to be offline.

[[nixos]]
hostname = "server-01"
url = "http://server-01.tailnet-name.ts.net:9100/metrics"
username = "metrics"
password_file = "/secrets/node-exporter-pass"
critical = true

[[nixos]]
hostname = "server-02"
url = "http://server-02.tailnet-name.ts.net:9100/metrics"
username = "metrics"
password_file = "/secrets/node-exporter-pass"
critical = true

# Example non-critical machine:
# [[nixos]]
# hostname = "laptop"
# url = "http://laptop.tailnet-name.ts.net:9100/metrics"
# username = "metrics"
# password_file = "/secrets/node-exporter-pass"
# critical = false
